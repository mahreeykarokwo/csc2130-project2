    <head>

        <link rel="stylesheet"
        href="styles.css">
    </head>
    <body>
        <header class="site-header">
            <img src="images/image_(2).jpg"
            alt="Academic portal logo" width="90" height="90" loading="lazy">
            <div class="header-text">
                <h1>Academic Portal</h1>
                <p>Contact us</p>
            </div>
            </header>
            <nav class="navbar">
                <a href="home.html"
                class="nav-link">home</a>
                <a href="about.html"
              class="nav-link">about</a>

            class="nav-link">student records</a>

            class="nav-link">gallery</a>
                <a href="contact.html"
            class="nav-link active">contact</a>
        </nav>
        <main class="container">
        <h2>Get in touch</h2>
        <div class="form-card">
        <form>
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>student Reg Number:</label>
                    <input type="text" name="reg" placeholder="com/0051/25" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Message:</label>
                    <textarea
                    name="message"rows="5" required></textarea>
                </div>
                <button type="submit"
                class="btn">Send message</button>
                </form>
                </div>
                <!--Google maps iframe -All Required Attributes-->
                <div class="map-container">
                    <h3>Our Location -Kibabii University</h3>
                    <iframe
                src="https://www.Google.com/maps/embed?pb=!1m18!1m12!1m3!1d3989
                .8!2d!3d!2m3!1f0!2f0!3f0!3m2!1i1024i2i768!4f13.1!3m3!1m2!1s0x0%3A0x!2sKibabii
                %20University!5e0!3m2!1sen!2ske!4v!5m2!1sen!2ske"
                            width="100%"
                            height="400"
                            title="Kibabii University Location Map -Bungoma, Kenya"
                            loading="lazy"
                            style="border:0;"
                            allowfullscreen></iframe>
                </div>
                </main>
